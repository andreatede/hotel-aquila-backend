<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenotazione confermata — Hotel Aquila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0E2321;--stone:#EDE6D5;--stone-2:#F6F2E8;--stone-dim:#B9AF95;
  --amber:#C98A2E;--amber-light:#E0A957;--azure:#3D7A8C;
  --font-display:'Newsreader',Georgia,serif;--font-body:'Space Grotesk',sans-serif;
}
body{font-family:var(--font-body);background:var(--ink);color:var(--stone-2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--stone-2);color:var(--ink);border-radius:20px;padding:2.6rem 2.2rem;max-width:440px;width:100%;box-shadow:0 40px 90px -24px rgba(0,0,0,.5);text-align:center}
.status-icon{width:64px;height:64px;margin:0 auto 1.2rem}
h1{font-family:var(--font-display);font-size:1.7rem;font-weight:500;margin-bottom:.4rem}
.sub{font-size:.9rem;color:#555;font-weight:300}
.boarding-card{margin-top:1.8rem;background:var(--stone);border-radius:12px;padding:1.4rem;text-align:left}
.code-lbl{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.code{font-family:var(--font-body);font-weight:700;font-size:1.5rem;letter-spacing:.05em}
.tear{border-top:1px dashed var(--stone-dim);margin-block:1rem}
.rows{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}
.rows div{font-size:.85rem}
.rows .l{display:block;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin-bottom:.2rem}
.note{margin-top:1.3rem;font-size:.85rem;color:var(--azure);font-weight:600}
a.btn{display:inline-flex;margin-top:1.6rem;background:var(--amber);color:var(--ink);font-weight:600;font-size:.9rem;padding:.9rem 1.8rem;border-radius:6px;text-decoration:none}
a.btn:hover{background:var(--amber-light)}
.error-box{color:#a83c3c}
.loader{width:34px;height:34px;border:3px solid rgba(14,35,33,.15);border-top-color:var(--amber);border-radius:50%;margin:0 auto 1.2rem;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="loader"></div>
    <h1>Verifica del pagamento…</h1>
    <p class="sub">Un attimo, stiamo confermando la tua prenotazione.</p>
  </div>

<script>
/* Same backend URL convention as the main site — override with window.HOTEL_AQUILA_API if needed. */
const API_BASE_URL = window.HOTEL_AQUILA_API || 'https://hotel-aquila-backend.onrender.com';

const params = new URLSearchParams(window.location.search);
const bookingId = params.get('booking');
const monthNamesShort = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
function fmt(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return `${d.getDate()} ${monthNamesShort[d.getMonth()]}`; }

async function fetchBooking(attempt = 1){
  if(!bookingId){
    renderError('Nessuna prenotazione indicata nel link.');
    return;
  }
  try {
    const res = await fetch(`${API_BASE_URL}/api/bookings/${bookingId}`);
    if(!res.ok) throw new Error('not found');
    const b = await res.json();
    if(b.status === 'paid'){
      renderSuccess(b);
    } else if(attempt < 6){
      /* Stripe's webhook can land a second or two after the redirect — retry briefly. */
      setTimeout(() => fetchBooking(attempt + 1), 1500);
    } else {
      renderError('Il pagamento risulta ancora in elaborazione. Se hai completato il pagamento, la conferma arriverà a breve via email — contattaci se il dubbio persiste.');
    }
  } catch(err){
    renderError('Non troviamo questa prenotazione. Se hai appena pagato, scrivici pure il codice per verificare manualmente.');
  }
}

function renderSuccess(b){
  const bars = Array.from({length:26}, () => `<span style="display:inline-block;width:${2+Math.random()*4}px;height:${30+Math.random()*40}px;background:var(--ink);opacity:.7;margin-right:2px"></span>`).join('');
  document.getElementById('card').innerHTML = `
    <svg class="status-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--amber)" stroke-width="4"/><path d="M28 52 L43 66 L72 34" fill="none" stroke="var(--amber)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Prenotazione confermata</h1>
    <p class="sub">Riceverai la conferma anche via email a breve.</p>
    <div class="boarding-card">
      <span class="code-lbl">Codice Prenotazione</span>
      <div class="code">${b.id}</div>
      <div class="tear"></div>
      <div class="rows">
        <div><span class="l">Check-in</span>${fmt(b.check_in)}</div>
        <div><span class="l">Check-out</span>${fmt(b.check_out)}</div>
        <div><span class="l">Ospite</span>${b.guest_name || '—'}</div>
        <div><span class="l">Totale</span>€${(b.amount_cents/100).toFixed(2)}</div>
      </div>
      <div style="margin-top:1rem">${bars}</div>
    </div>
    <p class="note">✓ Nessuna commissione di intermediazione — prenotazione diretta</p>
    <a class="btn" href="/">Torna al sito</a>
  `;
}

function renderError(msg){
  document.getElementById('card').innerHTML = `
    <h1>Un momento…</h1>
    <p class="sub error-box">${msg}</p>
    <a class="btn" href="/">Torna al sito</a>
  `;
}

fetchBooking();
</script>
</body>
</html>
