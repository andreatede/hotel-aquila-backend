<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pannello Prenotazioni — Hotel Aquila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0E2321;--ink-soft:#1B3A35;--stone:#EDE6D5;--stone-2:#F6F2E8;--stone-dim:#B9AF95;
  --amber:#C98A2E;--amber-light:#E0A957;--azure:#3D7A8C;--azure-light:#6FA3B3;
  --danger:#A83C3C;
  --font-display:'Newsreader',Georgia,serif;--font-body:'Space Grotesk',sans-serif;
}
body{font-family:var(--font-body);background:var(--stone-2);color:var(--ink);min-height:100vh}
h1,h2,h3{font-family:var(--font-display);font-weight:500}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input{font-family:inherit;font-size:1rem}

/* ---------- login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:1.5rem}
.login-card{background:var(--stone-2);border-radius:16px;padding:2.4rem 2.2rem;max-width:380px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.login-card .mark{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:1.2rem}
.login-card .mark svg{width:22px;height:22px}
.login-card h1{font-size:1.5rem;margin-bottom:.3rem}
.login-card p{font-size:.85rem;color:var(--ink-soft);opacity:.7;margin-bottom:1.6rem}
.login-card input{width:100%;border:1.5px solid var(--stone-dim);background:var(--stone);border-radius:8px;padding:.9rem 1rem;font-size:.95rem;margin-bottom:1rem}
.login-card input:focus{outline:none;border-color:var(--azure)}
.login-card button{width:100%;background:var(--amber);color:var(--ink);font-weight:700;padding:.9rem;border-radius:8px;font-size:.9rem;transition:background .2s}
.login-card button:hover{background:var(--amber-light)}
.login-error{color:var(--danger);font-size:.83rem;margin-top:.9rem;display:none}
.login-error.show{display:block}

/* ---------- dashboard ---------- */
#dashboardScreen{display:none}
.db-header{background:var(--ink);color:var(--stone-2);padding:1.1rem 1.8rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem}
.db-header .brand{display:flex;align-items:center;gap:.6rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.85rem}
.db-header .brand svg{width:22px;height:22px}
.db-header button{font-size:.8rem;font-weight:600;color:var(--stone-dim);border:1px solid rgba(243,233,221,.25);padding:.5rem 1rem;border-radius:6px;transition:background .2s,color .2s}
.live-indicator{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--stone-dim);margin-left:auto;margin-right:1rem}
.live-indicator .dot{width:7px;height:7px;border-radius:50%;background:var(--amber-light);animation:pulseDot 2s ease infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
@media(max-width:640px){.live-indicator{display:none}}
.db-header button:hover{background:rgba(243,233,221,.1);color:var(--stone-2)}

.db-body{max-width:1100px;margin:0 auto;padding:1.8rem 1.5rem 3rem}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.8rem}
.stat-card{background:var(--stone-2);border:1px solid rgba(14,35,33,.08);border-radius:10px;padding:1.1rem 1.2rem}
.stat-card .lbl{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);opacity:.6}
.stat-card .val{font-family:var(--font-display);font-size:1.7rem;margin-top:.3rem}
@media(max-width:720px){.stats-row{grid-template-columns:repeat(2,1fr)}}

.toolbar{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.search-box{position:relative;flex:1;min-width:220px}
.search-box input{width:100%;border:1.5px solid rgba(14,35,33,.15);background:var(--stone-2);border-radius:8px;padding:.7rem 1rem .7rem 2.3rem;font-size:.9rem}
.search-box input:focus{outline:none;border-color:var(--azure)}
.search-box svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.5}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tab{font-size:.8rem;font-weight:600;padding:.6rem 1rem;border-radius:999px;border:1.5px solid rgba(14,35,33,.15);color:var(--ink-soft);transition:all .2s}
.tab.active{background:var(--ink);color:var(--stone-2);border-color:var(--ink)}

.bookings-empty{text-align:center;padding:3rem 1rem;color:var(--ink-soft);opacity:.6;font-size:.9rem}

.booking-row{background:var(--stone-2);border:1px solid rgba(14,35,33,.08);border-radius:10px;padding:1.1rem 1.3rem;margin-bottom:.7rem;display:grid;grid-template-columns:auto 1fr auto auto;gap:1.2rem;align-items:center}
@media(max-width:820px){.booking-row{grid-template-columns:1fr;gap:.6rem}}
.booking-row.appena-arrivata{animation:evidenziaNuova 2.4s ease}
@keyframes evidenziaNuova{
  0%{background:rgba(201,138,46,.22);border-color:var(--amber)}
  100%{background:var(--stone-2);border-color:rgba(14,35,33,.08)}
}
.br-code{font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;background:var(--stone);padding:.35rem .6rem;border-radius:6px;white-space:nowrap;justify-self:start}
.br-main .guest{font-weight:600;font-size:.95rem}
.br-main .meta{font-size:.8rem;color:var(--ink-soft);opacity:.75;margin-top:.2rem}
.br-amount{text-align:right;font-weight:700;font-size:1rem;white-space:nowrap}
.br-amount small{display:block;font-weight:400;font-size:.68rem;opacity:.6}
.br-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-self:end}
.status-badge{font-size:.7rem;font-weight:700;letter-spacing:.03em;padding:.3rem .65rem;border-radius:999px;white-space:nowrap}
.status-paid{background:rgba(61,122,140,.15);color:var(--azure)}
.status-da_pagare_struttura{background:rgba(201,138,46,.18);color:#8a611e}
.status-annullata{background:rgba(168,60,60,.12);color:var(--danger)}
.btn-action{font-size:.75rem;font-weight:600;background:var(--ink);color:var(--stone-2);padding:.5rem .8rem;border-radius:6px;transition:background .2s;white-space:nowrap}
.btn-action:hover{background:var(--azure)}
.btn-action.danger{background:transparent;color:var(--danger);border:1px solid rgba(168,60,60,.3)}
.btn-action.danger:hover{background:rgba(168,60,60,.08)}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--stone-2);padding:.8rem 1.3rem;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="mark"><svg viewBox="0 0 40 40" fill="none"><path d="M8 25 L20 13 L32 25 M20 13 L20 29" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Pannello Hotel Aquila</h1>
    <p>Accesso riservato allo staff — inserisci la password per gestire le prenotazioni.</p>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Accedi</button>
    <p class="login-error" id="loginError">Password errata. Riprova.</p>
  </form>
</div>

<div id="dashboardScreen">
  <header class="db-header">
    <span class="brand">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="currentColor" stroke-width="1"/><path d="M8 25 L20 13 L32 25 M20 13 L20 29" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Hotel Aquila · Prenotazioni
    </span>
    <span class="live-indicator" id="liveIndicator"><span class="dot"></span>Aggiornato alle <span id="lastUpdate">—</span></span>
    <button id="logoutBtn">Esci</button>
  </header>

  <div class="db-body">
    <div class="stats-row">
      <div class="stat-card"><span class="lbl">Prenotazioni totali</span><div class="val" id="statTotal">—</div></div>
      <div class="stat-card"><span class="lbl">In arrivo oggi</span><div class="val" id="statToday">—</div></div>
      <div class="stat-card"><span class="lbl">Da incassare in struttura</span><div class="val" id="statDue">—</div></div>
      <div class="stat-card"><span class="lbl">Incassato online</span><div class="val" id="statRevenue">—</div></div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchBox" placeholder="Cerca per nome, codice o email…">
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">Tutte</button>
        <button class="tab" data-filter="paid">Pagate online</button>
        <button class="tab" data-filter="da_pagare_struttura">Da incassare</button>
        <button class="tab" data-filter="oggi">In arrivo oggi</button>
      </div>
    </div>

    <div id="bookingsList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE_URL = window.HOTEL_AQUILA_API || '';
let token = localStorage.getItem('hotelAquilaAdminToken');
let allBookings = [];
let currentFilter = 'all';
let searchQuery = '';

const monthNamesShort = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
function fmtDate(iso){ const d = new Date(iso+'T00:00:00'); return `${d.getDate()} ${monthNamesShort[d.getMonth()]}`; }
function todayIso(){ const d = new Date(); return d.toISOString().slice(0,10); }
function euro(cents){ return '€' + (cents/100).toFixed(2); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- login/logout ---------- */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  try {
    const res = await fetch(`${API_BASE_URL}/api/admin/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Accesso non riuscito.');
    token = data.token;
    localStorage.setItem('hotelAquilaAdminToken', token);
    mostraDashboard();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
  }
});

let refreshTimer = null;

function avviaAggiornamentoAutomatico(){
  fermaAggiornamentoAutomatico();
  refreshTimer = setInterval(() => {
    if (!document.hidden) caricaPrenotazioni(true);
  }, 20000); // ogni 20 secondi — abbastanza spesso da sembrare "vivo", senza intasare il server
}
function fermaAggiornamentoAutomatico(){
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}
// Se l'utente torna sulla scheda dopo essere stato altrove, aggiorna subito invece di
// aspettare il prossimo giro — così i dati non sono mai vecchi quando li guarda davvero.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && token) caricaPrenotazioni(true);
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  token = null;
  fermaAggiornamentoAutomatico();
  localStorage.removeItem('hotelAquilaAdminToken');
  document.getElementById('dashboardScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
});

async function mostraDashboard(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboardScreen').style.display = 'block';
  await caricaPrenotazioni();
  avviaAggiornamentoAutomatico();
}

/* ---------- dati ---------- */
async function caricaPrenotazioni(silenzioso){
  try {
    const res = await fetch(`${API_BASE_URL}/api/admin/bookings`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 401) {
      // token scaduto/non valido: torna al login
      token = null;
      fermaAggiornamentoAutomatico();
      document.getElementById('dashboardScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('loginError').textContent = 'Sessione scaduta, accedi di nuovo.';
      document.getElementById('loginError').classList.add('show');
      return;
    }
    const data = await res.json();
    if (!res.ok || !Array.isArray(data)) {
      // Il server ha risposto ma con un errore (es. problema database) — mostriamo
      // il messaggio vero invece di andare in crash su un dato che non è una lista.
      throw new Error(data.error || 'Risposta inattesa dal server.');
    }
    const idPrecedenti = new Set(allBookings.map(b => b.id));
    const nuoveArrivate = silenzioso ? data.filter(b => !idPrecedenti.has(b.id)).map(b => b.id) : [];

    allBookings = data;
    aggiornaStatistiche();
    renderPrenotazioni(nuoveArrivate);

    const ora = new Date();
    document.getElementById('lastUpdate').textContent =
      `${String(ora.getHours()).padStart(2,'0')}:${String(ora.getMinutes()).padStart(2,'0')}:${String(ora.getSeconds()).padStart(2,'0')}`;

    if (nuoveArrivate.length) showToast(`${nuoveArrivate.length} nuova/e prenotazione/i arrivata/e`);
  } catch (err) {
    document.getElementById('bookingsList').innerHTML = `<div class="bookings-empty">Errore nel caricamento: ${err.message}</div>`;
  }
}

function aggiornaStatistiche(){
  const oggi = todayIso();
  const attive = allBookings.filter(b => b.status !== 'annullata');
  document.getElementById('statTotal').textContent = attive.length;
  document.getElementById('statToday').textContent = attive.filter(b => b.check_in === oggi).length;
  document.getElementById('statDue').textContent = allBookings.filter(b => b.status === 'da_pagare_struttura').length;
  const incassato = allBookings.filter(b => b.status === 'paid').reduce((s,b) => s + b.amount_cents, 0);
  document.getElementById('statRevenue').textContent = euro(incassato);
}

function prenotazioniFiltrate(){
  const oggi = todayIso();
  let list = allBookings;
  if (currentFilter === 'paid') list = list.filter(b => b.status === 'paid');
  else if (currentFilter === 'da_pagare_struttura') list = list.filter(b => b.status === 'da_pagare_struttura');
  else if (currentFilter === 'oggi') list = list.filter(b => b.check_in === oggi && b.status !== 'annullata');

  if (searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(b =>
      (b.guest_name||'').toLowerCase().includes(q) ||
      (b.guest_email||'').toLowerCase().includes(q) ||
      (b.id||'').toLowerCase().includes(q)
    );
  }
  return list;
}

const STATUS_LABEL = { paid: 'Pagata online', da_pagare_struttura: 'Da incassare', annullata: 'Annullata' };

function renderPrenotazioni(nuoveArrivate){
  nuoveArrivate = nuoveArrivate || [];
  const list = prenotazioniFiltrate();
  const el = document.getElementById('bookingsList');
  if (!list.length){
    el.innerHTML = `<div class="bookings-empty">Nessuna prenotazione trovata per questo filtro.</div>`;
    return;
  }
  el.innerHTML = list.map(b => `
    <div class="booking-row ${nuoveArrivate.includes(b.id) ? 'appena-arrivata' : ''}">
      <span class="br-code">${b.id}</span>
      <div class="br-main">
        <div class="guest">${b.guest_name || '—'}</div>
        <div class="meta">${b.room_name || b.room_id} · ${fmtDate(b.check_in)} → ${fmtDate(b.check_out)} · ${b.adults + (b.children||0)} ospiti · ${b.guest_phone || ''}</div>
      </div>
      <div class="br-amount">${euro(b.amount_cents)}<small>totale</small></div>
      <div class="br-actions">
        <span class="status-badge status-${b.status}">${STATUS_LABEL[b.status] || b.status}</span>
        ${b.status === 'da_pagare_struttura' ? `<button class="btn-action" data-action="paid" data-id="${b.id}">Segna incassata</button>` : ''}
        ${b.status !== 'annullata' ? `<button class="btn-action danger" data-action="annulla" data-id="${b.id}">Annulla</button>` : ''}
      </div>
    </div>
  `).join('');
}

document.getElementById('bookingsList').addEventListener('click', async (e) => {
  const btn = e.target.closest('.btn-action');
  if (!btn) return;
  const id = btn.dataset.id;
  const nuovoStato = btn.dataset.action === 'paid' ? 'paid' : 'annullata';
  const conferma = btn.dataset.action === 'annulla' ? confirm(`Annullare la prenotazione ${id}? L'azione libera le date.`) : true;
  if (!conferma) return;
  try {
    const res = await fetch(`${API_BASE_URL}/api/admin/bookings/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ status: nuovoStato })
    });
    if (!res.ok) throw new Error((await res.json()).error || 'Operazione non riuscita.');
    showToast(nuovoStato === 'paid' ? `${id} segnata come incassata` : `${id} annullata`);
    await caricaPrenotazioni();
  } catch (err) {
    showToast('Errore: ' + err.message);
  }
});

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentFilter = tab.dataset.filter;
  renderPrenotazioni();
});

let searchTimer;
document.getElementById('searchBox').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQuery = e.target.value; renderPrenotazioni(); }, 200);
});

/* ---------- avvio ---------- */
if (token) mostraDashboard();
</script>
</body>
</html>
